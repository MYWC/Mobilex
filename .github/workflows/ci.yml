name: Mobilex 2.0 CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Final quality gates
        run: npm run quality:phase10
      - name: GitHub Pages preflight
        run: npm run pages:check
